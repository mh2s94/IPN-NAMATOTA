@font-face{font-family:IDB;src:url(assets/fonts/InterDisplay-Black.woff) format('woff');font-display:swap}
@font-face{font-family:IDBold;src:url(assets/fonts/InterDisplay-Bold.woff) format('woff');font-display:swap}
@font-face{font-family:IDM;src:url(assets/fonts/InterDisplay-Medium.woff) format('woff');font-display:swap}

@font-face{font-family:Mono;src:url(assets/fonts/DejaVuSansMono.woff) format('woff');font-display:swap}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#02101D;overflow:hidden;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;width:100%;height:100%;height:100dvh;display:block;touch-action:manipulation}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ctrl{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));display:flex;gap:10px;z-index:2}
.ctrl button{width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(2,16,29,.45);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;display:grid;place-items:center;cursor:pointer;padding:0;
  transition:transform .2s ease,background .2s ease,opacity .3s ease}
.ctrl button:hover{transform:scale(1.08);background:rgba(227,6,19,.85)}
.ctrl button:focus-visible{outline:2px solid #E30613;outline-offset:3px}
.ctrl svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#replay.pulse{animation:pulse 1.6s ease-in-out infinite;background:#E30613;border-color:#E30613}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(227,6,19,.55)}50%{box-shadow:0 0 0 12px rgba(227,6,19,0)}}
#hint{position:fixed;left:50%;bottom:max(80px,calc(env(safe-area-inset-bottom) + 72px));transform:translate(-50%,10px);z-index:2;
  padding:10px 18px 10px 40px;border-radius:999px;background:rgba(2,16,29,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.25);color:#fff;font:500 13px/1.2 system-ui,-apple-system,sans-serif;letter-spacing:.04em;white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity .4s ease,transform .4s ease}
#hint::before{content:"";position:absolute;left:16px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:#E30613;animation:ping 1.4s ease-out infinite}
#hint.show{opacity:1;transform:translate(-50%,0)}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(227,6,19,.7)}100%{box-shadow:0 0 0 10px rgba(227,6,19,0)}}
</style>
</head>
<body>
<h1 class="sr">PT. Industri Perikanan Namatota</h1>

<canvas id="stage" role="img" aria-label="Animasi profil PT. Industri Perikanan Namatota"></canvas>
<div id="hint" role="status">Ketuk layar untuk menyalakan suara</div>
<div class="ctrl">
  <button id="sound" aria-label="Nyalakan suara" title="Suara">
    <svg id="icoOff" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m22 9-6 6M16 9l6 6"/></svg>
    <svg id="icoOn" viewBox="0 0 24 24" style="display:none"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
  </button>
  <button id="replay" aria-label="Putar ulang" title="Putar ulang">
    <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v6h6"/></svg>
  </button>
</div>
